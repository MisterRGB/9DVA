<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UV Texture Painting Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }

        #app {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            gap: 2px;
            background: #1a1a1a;
        }

        .panel {
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            background: #252525;
            padding: 12px 20px;
            border-bottom: 1px solid #333;
            font-size: 14px;
            font-weight: 600;
            color: #4a9eff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .panel-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow: hidden;
        }

        .toolbar {
            background: #252525;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .tool-group {
            display: flex;
            gap: 5px;
            padding-right: 10px;
            border-right: 1px solid #333;
        }

        .tool-group:last-child {
            border-right: none;
        }

        .tool-btn {
            background: #2a2a2a;
            border: 1px solid #3a3a3a;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tool-btn:hover {
            background: #353535;
            border-color: #4a9eff;
        }

        .tool-btn.active {
            background: #4a9eff;
            border-color: #4a9eff;
            color: white;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .slider-group label {
            font-size: 12px;
            color: #999;
            min-width: 60px;
        }

        .slider-group input[type="range"] {
            width: 100px;
            height: 4px;
            background: #3a3a3a;
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #4a9eff;
            border-radius: 50%;
            cursor: pointer;
        }

        .slider-group input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: #4a9eff;
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .color-picker {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker input[type="color"] {
            width: 40px;
            height: 30px;
            border: 1px solid #3a3a3a;
            border-radius: 4px;
            cursor: pointer;
            background: #2a2a2a;
        }

        .color-palette {
            display: flex;
            gap: 5px;
        }

        .color-swatch {
            width: 25px;
            height: 25px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .color-swatch:hover {
            transform: scale(1.1);
            border-color: #4a9eff;
        }

        .color-swatch.active {
            border-color: #4a9eff;
        }

        .canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0f0f;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        #uv-canvas {
            border: 2px solid #333;
            cursor: crosshair;
            image-rendering: pixelated;
        }

        #uv-stack {
            position: relative;
            transform-origin: 0 0;
        }

        #uv-guide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.55;
        }

        #three-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .status-bar {
            background: #252525;
            padding: 8px 15px;
            font-size: 12px;
            color: #999;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        .info-overlay {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 12px;
            color: #ccc;
            pointer-events: none;
        }

        .brush-preview {
            position: absolute;
            border: 2px solid #4a9eff;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0.5;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .recording-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ff4444;
            border-radius: 50%;
            margin-right: 5px;
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Left Panel: 2D UV Canvas Editor -->
        <div class="panel">
            <div class="panel-header">2D UV Canvas Editor</div>
            <div class="panel-content">
                <div class="toolbar">
                    <div class="tool-group">
                        <button class="tool-btn active" data-tool="brush" title="Brush Tool (B)">Brush</button>
                        <button class="tool-btn" data-tool="fill" title="Paint Bucket (G)">Fill</button>
                        <button class="tool-btn" data-tool="eraser" title="Eraser (E)">Eraser</button>
                        <button class="tool-btn" data-tool="eyedropper" title="Eyedropper (I)">Pick</button>
                        <button class="tool-btn" data-tool="smudge" title="Smudge (S)">Smudge</button>
                    </div>

                    <div class="tool-group">
                        <div class="slider-group">
                            <label>Size:</label>
                            <input type="range" id="brush-size" min="2" max="40" value="8">
                            <span id="size-value">8px</span>
                        </div>
                        <div class="slider-group">
                            <label>Opacity:</label>
                            <input type="range" id="brush-opacity" min="0" max="100" value="100">
                            <span id="opacity-value">100%</span>
                        </div>
                    </div>

                    <div class="tool-group">
                        <div class="color-picker">
                            <input type="color" id="color-picker" value="#4a9eff">
                            <div class="color-palette">
                                <div class="color-swatch active" style="background: #4a9eff;" data-color="#4a9eff"></div>
                                <div class="color-swatch" style="background: #ff4a4a;" data-color="#ff4a4a"></div>
                                <div class="color-swatch" style="background: #4aff4a;" data-color="#4aff4a"></div>
                                <div class="color-swatch" style="background: #ffff4a;" data-color="#ffff4a"></div>
                                <div class="color-swatch" style="background: #ff4aff;" data-color="#ff4aff"></div>
                                <div class="color-swatch" style="background: #ffffff;" data-color="#ffffff"></div>
                                <div class="color-swatch" style="background: #000000;" data-color="#000000"></div>
                            </div>
                        </div>
                    </div>

                    <div class="tool-group">
                        <button class="tool-btn" id="undo-btn" title="Undo (Ctrl+Z)">Undo</button>
                        <button class="tool-btn" id="redo-btn" title="Redo (Ctrl+Y)">Redo</button>
                        <button class="tool-btn" id="clear-btn" title="Clear Canvas">Clear</button>
                        <button class="tool-btn active" id="guide-btn" title="Cycle guide mode: outlines -> full -> off">Outlines</button>
                        <button class="tool-btn" id="fit-btn" title="Fit islands in view (F)">Fit</button>
                        <button class="tool-btn" id="template-btn" title="Load Custom UV Template Image">Template</button>
                        <button class="tool-btn" id="export-btn" title="Export PNG">Export</button>
                    </div>
                </div>

                <div class="canvas-container">
                    <div id="uv-stack">
                        <canvas id="uv-canvas" width="1024" height="1024"></canvas>
                        <canvas id="uv-guide" width="1024" height="1024"></canvas>
                    </div>
                    <div class="brush-preview" id="brush-preview"></div>
                </div>

                <div class="status-bar">
                    <span>Tool: <strong id="current-tool">Brush</strong></span>
                    <span>Position: <span id="cursor-pos">0, 0</span></span>
                    </div>
            </div>
        </div>

        <!-- Right Panel: 3D Live Preview -->
        <div class="panel">
            <div class="panel-header">3D Live Preview Viewport</div>
            <div class="panel-content">
                <div class="canvas-container">
                    <canvas id="three-canvas"></canvas>
                    <div class="info-overlay">
                        <div>Left Click + Drag: Rotate</div>
                        <div>Right Click + Drag: Pan</div>
                        <div>Scroll: Zoom</div>
                    </div>
                </div>
                <div class="status-bar">
                    <span><span class="recording-indicator"></span>Live Sync Active</span>
                    <span>FPS: <span id="fps-counter">60</span></span>
                    <span>Vertices: <span id="vertex-count">0</span></span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>

    <script>
        // ============================================
        // UV TEXTURE PAINTING STUDIO
        // ============================================

        // Global State
        const state = {
            currentTool: 'brush',
            brushSize: 8,
            brushOpacity: 1.0,
            currentColor: '#4a9eff',
            isDrawing: false,
            lastX: 0,
            lastY: 0,
            history: [],
            historyIndex: -1,
            maxHistory: 20,
            guideMode: 'outlines'
        };

        // ============================================
        // 2D CANVAS SETUP
        // ============================================
        const uvCanvas = document.getElementById('uv-canvas');
        const ctx = uvCanvas.getContext('2d');
        const brushPreview = document.getElementById('brush-preview');
        const uvGuide = document.getElementById('uv-guide');
        const guideCtx = uvGuide.getContext('2d');
        const uvStack = document.getElementById('uv-stack');
        const uvContainer = document.querySelector('#uv-canvas').closest('.canvas-container');

        // ============================================
        // 2D VIEW (PAN / ZOOM)
        // ============================================
        // CSS-transform based, so the guide overlay, hit-testing and the brush
        // preview all stay aligned with the paint surface automatically.
        const view = { s: 1, tx: 0, ty: 0 };
        const panState = { active: false, space: false, x: 0, y: 0, tx: 0, ty: 0 };

        function applyView() {
            uvStack.style.transform = 'translate(' + view.tx + 'px,' + view.ty + 'px) scale(' + view.s + ')';
        }

        function clampView() {
            view.s = Math.min(Math.max(view.s, 0.05), 16);
            view.tx = Math.min(Math.max(view.tx, -8192), 8192);
            view.ty = Math.min(Math.max(view.ty, -8192), 8192);
        }

        function fitView() {
            const cw = uvContainer.clientWidth, ch = uvContainer.clientHeight;
            let u0 = 0, v0 = 0, u1 = 1, v1 = 1;
            if (boxMesh) {
                let mnU = Infinity, mnV = Infinity, mxU = -Infinity, mxV = -Infinity;
                boxMesh.traverse(o => {
                    if (!o.isMesh || !o.geometry || !o.geometry.attributes.uv) return;
                    const uv = o.geometry.attributes.uv;
                    for (let i = 0; i < uv.count; i++) {
                        const u = uv.getX(i), v = uv.getY(i);
                        if (u < mnU) mnU = u; if (u > mxU) mxU = u;
                        if (v < mnV) mnV = v; if (v > mxV) mxV = v;
                    }
                });
                if (mxU > mnU) {
                    const pu = (mxU - mnU) * 0.04, pv = (mxV - mnV) * 0.04;
                    u0 = mnU - pu; u1 = mxU + pu; v0 = mnV - pv; v1 = mxV + pv;
                }
            }
            const wpx = (u1 - u0) * uvCanvas.width, hpx = (v1 - v0) * uvCanvas.height;
            view.s = Math.min(cw / wpx, ch / hpx) * 0.92;
            view.tx = (cw - wpx * view.s) / 2 - u0 * uvCanvas.width * view.s;
            view.ty = (ch - hpx * view.s) / 2 - v0 * uvCanvas.height * view.s;
            clampView();
            applyView();
        }

        function zoomAt(cx, cy, factor) {
            const cr = uvContainer.getBoundingClientRect();
            const px = cx - cr.left - uvStack.offsetLeft;
            const py = cy - cr.top - uvStack.offsetTop;
            const ns = Math.min(Math.max(view.s * factor, 0.05), 16);
            view.tx = px - ((px - view.tx) / view.s) * ns;
            view.ty = py - ((py - view.ty) / view.s) * ns;
            view.s = ns;
            clampView();
            applyView();
        }

        uvContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0012));
        }, { passive: false });

        window.addEventListener('keydown', (e) => { if (e.code === 'Space') panState.space = true; });
        window.addEventListener('keyup', (e) => { if (e.code === 'Space') panState.space = false; });
        window.addEventListener('mousemove', (e) => {
            if (!panState.active) return;
            view.tx = panState.tx + (e.clientX - panState.x);
            view.ty = panState.ty + (e.clientY - panState.y);
            clampView();
            applyView();
        });
        window.addEventListener('mouseup', () => {
            if (panState.active) {
                panState.active = false;
                uvCanvas.style.cursor = 'crosshair';
            }
        });

        function drawUVTemplate() {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, uvCanvas.width, uvCanvas.height);

            const img = new Image();
            img.onload = () => {
                // Stretch to fill the whole canvas - UV space spans the full
                // image edge to edge, so painted pixels == sampled texels
                ctx.drawImage(img, 0, 0, uvCanvas.width, uvCanvas.height);
                saveState();
            };
            img.onerror = () => saveState();
            img.src = BOX_TEMPLATE_PNG;
        }

        // ============================================
        // UV WIREFRAME GUIDE
        // ============================================
        function drawUVWireframe(root) {
            const W = uvGuide.width;
            const H = uvGuide.height;
            guideCtx.clearRect(0, 0, W, H);

            const palette = ['#4a9eff', '#ff4a4a', '#4aff4a', '#ffff4a', '#ff4aff', '#00e5ff'];
            let meshIndex = 0;
            let foundUVs = false;
            const mode = state.guideMode;
            const gBounds = mode === 'outlines' ? getModelBounds(root) : null;
            const anchors = [];

            root.traverse((child) => {
                if (!child.isMesh || !child.geometry || !child.geometry.attributes.uv) return;

                const uv = child.geometry.attributes.uv;
                const idx = child.geometry.index;
                const pos = child.geometry.attributes.position;
                const triCount = Math.floor((idx ? idx.count : uv.count) / 3);
                if (triCount === 0) return;

                foundUVs = true;
                if (mode === 'off') return;

                guideCtx.strokeStyle = palette[meshIndex % palette.length];
                guideCtx.lineWidth = 1;
                guideCtx.beginPath();

                if (mode === 'full') {
                    // Cap triangle count for very dense meshes
                    const step = Math.max(1, Math.floor(triCount / 30000));
                    for (let t = 0; t < triCount; t += step) {
                        const a = idx ? idx.getX(t * 3) : t * 3;
                        const b = idx ? idx.getX(t * 3 + 1) : t * 3 + 1;
                        const c = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;

                        // flipY=false matches glTF: canvas row 0 == v 0, no V flip
                        guideCtx.moveTo(uv.getX(a) * W, uv.getY(a) * H);
                        guideCtx.lineTo(uv.getX(b) * W, uv.getY(b) * H);
                        guideCtx.lineTo(uv.getX(c) * W, uv.getY(c) * H);
                        guideCtx.closePath();
                    }
                } else {
                    // Island outlines: an edge shared by exactly one triangle is a
                    // shell border; everything shared by two is interior and culled.
                    // Connected components (islands) also anchor the part labels,
                    // so each island carries its own correctly-placed label.
                    const edges = new Map();
                    const Q = 16384;
                    const vkey = (u, v) => Math.round(u * Q) + ',' + Math.round(v * Q);
                    const parent = new Map();
                    const find = k => {
                        while (parent.get(k) !== k) {
                            parent.set(k, parent.get(parent.get(k)));
                            k = parent.get(k);
                        }
                        return k;
                    };
                    const addEdge = (ax, ay, bx, by) => {
                        const qa = Math.round(ax * Q) + ',' + Math.round(ay * Q);
                        const qb = Math.round(bx * Q) + ',' + Math.round(by * Q);
                        if (qa === qb) return;
                        const k = qa < qb ? qa + '|' + qb : qb + '|' + qa;
                        const e = edges.get(k);
                        if (e) e.n++;
                        else edges.set(k, { ax, ay, bx, by, n: 1 });
                    };

                    const tris = new Int32Array(triCount * 3);
                    const tLabels = [];

                    for (let t = 0; t < triCount; t++) {
                        const ia = idx ? idx.getX(t * 3) : t * 3;
                        const ib = idx ? idx.getX(t * 3 + 1) : t * 3 + 1;
                        const ic = idx ? idx.getX(t * 3 + 2) : t * 3 + 2;
                        tris[t * 3] = ia; tris[t * 3 + 1] = ib; tris[t * 3 + 2] = ic;

                        const au = uv.getX(ia), av = uv.getY(ia);
                        const bu = uv.getX(ib), bv = uv.getY(ib);
                        const cu = uv.getX(ic), cv = uv.getY(ic);

                        const ka = vkey(au, av), kb = vkey(bu, bv), kc = vkey(cu, cv);
                        if (!parent.has(ka)) parent.set(ka, ka);
                        if (!parent.has(kb)) parent.set(kb, kb);
                        if (!parent.has(kc)) parent.set(kc, kc);
                        parent.set(find(ka), find(kb));
                        parent.set(find(kb), find(kc));

                        addEdge(au, av, bu, bv);
                        addEdge(bu, bv, cu, cv);
                        addEdge(cu, cv, au, av);

                        _ta.fromBufferAttribute(pos, ia).applyMatrix4(child.matrixWorld);
                        _tb.fromBufferAttribute(pos, ib).applyMatrix4(child.matrixWorld);
                        _tc.fromBufferAttribute(pos, ic).applyMatrix4(child.matrixWorld);
                        tLabels.push(triangleLabel(_ta, _tb, _tc, gBounds));
                    }

                    edges.forEach(e => {
                        if (e.n !== 1) return;
                        guideCtx.moveTo(e.ax * W, e.ay * H);
                        guideCtx.lineTo(e.bx * W, e.by * H);
                    });

                    // One anchor per island: bbox center + dominant part label
                    const comps = new Map();
                    for (let t = 0; t < triCount; t++) {
                        const r = find(vkey(uv.getX(tris[t * 3]), uv.getY(tris[t * 3])));
                        let c = comps.get(r);
                        if (!c) {
                            c = { minU: Infinity, maxU: -Infinity, minV: Infinity, maxV: -Infinity, n: 0, lbl: new Map() };
                            comps.set(r, c);
                        }
                        for (let j = 0; j < 3; j++) {
                            const u = uv.getX(tris[t * 3 + j]), v = uv.getY(tris[t * 3 + j]);
                            if (u < c.minU) c.minU = u; if (u > c.maxU) c.maxU = u;
                            if (v < c.minV) c.minV = v; if (v > c.maxV) c.maxV = v;
                        }
                        c.n++;
                        c.lbl.set(tLabels[t], (c.lbl.get(tLabels[t]) || 0) + 1);
                    }
                    comps.forEach(c => {
                        if (c.n < 12) return; // skip sliver fragments
                        let best = '', bn = 0;
                        c.lbl.forEach((n, l) => { if (n > bn) { bn = n; best = l; } });
                        anchors.push({ u: (c.minU + c.maxU) / 2, v: (c.minV + c.maxV) / 2, label: best });
                    });
                }

                guideCtx.stroke();
                meshIndex++;
            });

            // Draw one label per island anchor
            if (mode === 'outlines') {
                guideCtx.font = '600 22px Segoe UI';
                guideCtx.textAlign = 'center';
                guideCtx.textBaseline = 'middle';
                guideCtx.fillStyle = 'rgba(50,50,50,0.65)';
                anchors.forEach(a => guideCtx.fillText(a.label, a.u * W, a.v * H));
            }

            return foundUVs;
        }

        // ============================================
        // ISLAND CLASSIFICATION (labels the guide outlines)
        // ============================================
        const SNAP_CFG = { headMax: 0.72, legMax: 0.30, armFrac: 0.33 };
        const HEAD_FACE_PANELS = {
            '+z': 'head_front', '-z': 'head_back',
            '+x': 'head_right', '-x': 'head_left',
            '+y': 'head_top', '-y': 'head_bottom'
        };

        function classifyPart(c, bounds) {
            const size = new THREE.Vector3();
            bounds.getSize(size);
            const ny = (c.y - bounds.min.y) / (size.y || 1);
            const midX = bounds.min.x + size.x / 2;
            if (ny >= SNAP_CFG.headMax) return 'head';
            if (ny <= SNAP_CFG.legMax) return c.x < midX ? 'footL' : 'footR';
            if (Math.abs(c.x - midX) > size.x * SNAP_CFG.armFrac) return c.x < midX ? 'armL' : 'armR';
            return 'torso';
        }

        function dominantAxis(n) {
            const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
            if (ax >= ay && ax >= az) return n.x >= 0 ? '+x' : '-x';
            if (ay >= az) return n.y >= 0 ? '+y' : '-y';
            return n.z >= 0 ? '+z' : '-z';
        }

        function getModelBounds(model) {
            const b = new THREE.Box3();
            model.updateMatrixWorld(true);
            model.traverse(o => { if (o.isMesh) b.expandByObject(o); });
            return b;
        }

        const _ta = new THREE.Vector3(), _tb = new THREE.Vector3(), _tc = new THREE.Vector3(),
              _e1 = new THREE.Vector3(), _e2 = new THREE.Vector3(), _mid = new THREE.Vector3();
        function triangleLabel(aV, bV, cV, bounds) {
            _mid.copy(aV).add(bV).add(cV).multiplyScalar(1 / 3);
            _e1.subVectors(aV, bV);
            _e2.subVectors(cV, bV);
            _e1.cross(_e2);
            const part = classifyPart(_mid, bounds);
            return part === 'head' ? HEAD_FACE_PANELS[dominantAxis(_e1)] : part;
        }



        // ============================================
        // PAINTING TOOLS
        // ============================================
        function drawBrush(x, y, color, size, opacity) {
            ctx.globalAlpha = opacity;
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }

        function drawLine(x1, y1, x2, y2, color, size, opacity) {
            ctx.globalAlpha = opacity;
            ctx.strokeStyle = color;
            ctx.lineWidth = size;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        function floodFill(startX, startY, fillColor) {
            const imageData = ctx.getImageData(0, 0, uvCanvas.width, uvCanvas.height);
            const data = imageData.data;
            const width = uvCanvas.width;
            const height = uvCanvas.height;

            const startIdx = (startY * width + startX) * 4;
            const startR = data[startIdx];
            const startG = data[startIdx + 1];
            const startB = data[startIdx + 2];
            const startA = data[startIdx + 3];

            // Parse fill color
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.fillStyle = fillColor;
            tempCtx.fillRect(0, 0, 1, 1);
            const fillData = tempCtx.getImageData(0, 0, 1, 1).data;
            const fillR = fillData[0];
            const fillG = fillData[1];
            const fillB = fillData[2];
            const fillA = fillData[3];

            // Don't fill if same color
            if (startR === fillR && startG === fillG && startB === fillB && startA === fillA) {
                return;
            }

            const stack = [[startX, startY]];
            const visited = new Set();

            while (stack.length > 0) {
                const [x, y] = stack.pop();
                const key = `${x},${y}`;

                if (visited.has(key)) continue;
                if (x < 0 || x >= width || y < 0 || y >= height) continue;

                const idx = (y * width + x) * 4;
                const r = data[idx];
                const g = data[idx + 1];
                const b = data[idx + 2];
                const a = data[idx + 3];

                // Check if color matches start color (with tolerance)
                const tolerance = 10;
                if (Math.abs(r - startR) > tolerance ||
                    Math.abs(g - startG) > tolerance ||
                    Math.abs(b - startB) > tolerance ||
                    Math.abs(a - startA) > tolerance) {
                    continue;
                }

                visited.add(key);
                data[idx] = fillR;
                data[idx + 1] = fillG;
                data[idx + 2] = fillB;
                data[idx + 3] = fillA;

                stack.push([x + 1, y]);
                stack.push([x - 1, y]);
                stack.push([x, y + 1]);
                stack.push([x, y - 1]);
            }

            ctx.putImageData(imageData, 0, 0);
        }

        function pickColor(x, y) {
            const pixel = ctx.getImageData(x, y, 1, 1).data;
            const hex = '#' + [pixel[0], pixel[1], pixel[2]]
                .map(v => v.toString(16).padStart(2, '0'))
                .join('');
            state.currentColor = hex;
            document.getElementById('color-picker').value = hex;
            updateColorSwatches();
        }

        function smudge(x, y, size) {
            const radius = size / 2;
            const imageData = ctx.getImageData(
                Math.max(0, x - radius),
                Math.max(0, y - radius),
                Math.min(radius * 2, uvCanvas.width - (x - radius)),
                Math.min(radius * 2, uvCanvas.height - (y - radius))
            );

            // Blur the sampled area
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = imageData.width;
            tempCanvas.height = imageData.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.putImageData(imageData, 0, 0);

            ctx.globalAlpha = 0.5;
            ctx.drawImage(tempCanvas, x - radius, y - radius);
            ctx.globalAlpha = 1.0;
        }

        // ============================================
        // HISTORY (UNDO/REDO)
        // ============================================
        function saveState() {
            const imageData = ctx.getImageData(0, 0, uvCanvas.width, uvCanvas.height);
            
            // Remove future states if we're not at the end
            if (state.historyIndex < state.history.length - 1) {
                state.history = state.history.slice(0, state.historyIndex + 1);
            }

            state.history.push(imageData);
            
            // Limit history size
            if (state.history.length > state.maxHistory) {
                state.history.shift();
            } else {
                state.historyIndex++;
            }

            updateTexture();
        }

        function undo() {
            if (state.historyIndex > 0) {
                state.historyIndex--;
                ctx.putImageData(state.history[state.historyIndex], 0, 0);
                updateTexture();
            }
        }

        function redo() {
            if (state.historyIndex < state.history.length - 1) {
                state.historyIndex++;
                ctx.putImageData(state.history[state.historyIndex], 0, 0);
                updateTexture();
            }
        }

        // ============================================
        // THREE.JS SETUP
        // ============================================
        let scene, camera, renderer, controls, boxMesh, texture;
        let lastFrameTime = performance.now();
        let frameCount = 0;
        let fps = 60;

        function initThreeJS() {
            const container = document.querySelector('#three-canvas').parentElement;
            const canvas = document.getElementById('three-canvas');

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f0f0f);

            // Camera
            camera = new THREE.PerspectiveCamera(
                75,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(3, 2, 3);

            // Renderer
            renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputEncoding = THREE.sRGBEncoding; // match the canvas's sRGB colors

            // Controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lighting - 3-point studio rig
            // Soft base so shadows never go fully black
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.25);
            scene.add(ambientLight);

            // Key: main light, upper right and in front of the model
            const keyLight = new THREE.DirectionalLight(0xfff4e6, 0.85);
            keyLight.position.set(4, 6, 5);
            scene.add(keyLight);

            // Fill: dimmer, cooler, from the left to soften the key's shadows
            const fillLight = new THREE.DirectionalLight(0xe6f0ff, 0.35);
            fillLight.position.set(-5, 2, 3);
            scene.add(fillLight);

            // Rim: from behind and above for edge separation from the background
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.55);
            rimLight.position.set(-2, 5, -6);
            scene.add(rimLight);

            // Create texture from canvas
            texture = new THREE.CanvasTexture(uvCanvas);
            texture.flipY = false; // glTF UVs expect top-left origin - flipping causes reversed textures
            texture.encoding = THREE.sRGBEncoding; // keep painted colors true on the model
            texture.needsUpdate = true;

            // Load custom model
            const loader = new THREE.GLTFLoader();
            loader.load('Character.glb', (gltf) => {
                const model = gltf.scene;
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.material = new THREE.MeshStandardMaterial({
                            map: texture,
                            side: THREE.DoubleSide
                        });
                    }
                });
                scene.add(model);
                boxMesh = model;

                // Keep the model's authored facing - viewing its back through
                // DoubleSide materials mirrors the texture. Press R to spin
                // 180 if a particular model imports facing away.
                const bbox = new THREE.Box3().setFromObject(model);
                const bsize = new THREE.Vector3();
                const bcenter = new THREE.Vector3();
                bbox.getSize(bsize);
                bbox.getCenter(bcenter);
                controls.target.copy(bcenter);
                const dist = Math.max(bsize.x, bsize.y, bsize.z) * 1.5;
                camera.position.set(
                    bcenter.x + dist * 0.55,
                    bcenter.y + dist * 0.35,
                    bcenter.z + dist * 0.75
                );
                controls.update();

                // Reset paint surface and show the island guide
                drawUVTemplate();
                if (!drawUVWireframe(model)) {
                    alert('Character.glb has no UV coordinates, so painting cannot be mapped to it. Re-export the model with UVs.');
                }
                fitView();

                // Update vertex count
                let totalVertices = 0;
                model.traverse((child) => {
                    if (child.isMesh && child.geometry) {
                        totalVertices += child.geometry.attributes.position.count;
                    }
                });
                document.getElementById('vertex-count').textContent = totalVertices;
            }, undefined, (error) => {
                alert('Failed to load Character.glb - make sure it is next to index.html.\n\n' + error);
            });

            // Grid helper
            const gridHelper = new THREE.GridHelper(10, 10, 0x444444, 0x222222);
            scene.add(gridHelper);

            // Handle resize
            window.addEventListener('resize', onWindowResize);
            onWindowResize();

            // Start animation loop
            animate();
        }

        function updateTexture() {
            if (texture) {
                texture.needsUpdate = true;
            }
        }

        function onWindowResize() {
            const container = document.querySelector('#three-canvas').parentElement;
            const width = container.clientWidth;
            const height = container.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function animate() {
            requestAnimationFrame(animate);

            controls.update();
            renderer.render(scene, camera);

            // FPS counter
            frameCount++;
            const currentTime = performance.now();
            if (currentTime - lastFrameTime >= 1000) {
                fps = frameCount;
                document.getElementById('fps-counter').textContent = fps;
                frameCount = 0;
                lastFrameTime = currentTime;
            }
        }

        // ============================================
        // EVENT HANDLERS
        // ============================================
        function getCanvasCoordinates(e) {
            const cr = uvContainer.getBoundingClientRect();
            return {
                x: (e.clientX - cr.left - uvStack.offsetLeft - view.tx) / view.s,
                y: (e.clientY - cr.top - uvStack.offsetTop - view.ty) / view.s
            };
        }

        uvCanvas.addEventListener('mousedown', (e) => {
            if (e.button === 1 || (panState.space && e.button === 0)) {
                e.preventDefault();
                panState.active = true;
                panState.x = e.clientX;
                panState.y = e.clientY;
                panState.tx = view.tx;
                panState.ty = view.ty;
                uvCanvas.style.cursor = 'grabbing';
                return;
            }
            state.isDrawing = true;
            const { x, y } = getCanvasCoordinates(e);
            state.lastX = x;
            state.lastY = y;

            if (state.currentTool === 'brush' || state.currentTool === 'eraser') {
                const color = state.currentTool === 'eraser' ? '#ffffff' : state.currentColor;
                drawBrush(x, y, color, state.brushSize, state.brushOpacity);
            } else if (state.currentTool === 'fill') {
                floodFill(Math.floor(x), Math.floor(y), state.currentColor);
                saveState();
            } else if (state.currentTool === 'eyedropper') {
                pickColor(Math.floor(x), Math.floor(y));
            } else if (state.currentTool === 'smudge') {
                smudge(x, y, state.brushSize);
            }
        });

        uvCanvas.addEventListener('mousemove', (e) => {
            const { x, y } = getCanvasCoordinates(e);
            document.getElementById('cursor-pos').textContent = 
                `${Math.floor(x)}, ${Math.floor(y)}`;

            // Update brush preview (tracks the pan/zoom view)
            const d = state.brushSize * view.s;
            brushPreview.style.width = d + 'px';
            brushPreview.style.height = d + 'px';
            brushPreview.style.left = (uvStack.offsetLeft + view.tx + x * view.s - d / 2) + 'px';
            brushPreview.style.top = (uvStack.offsetTop + view.ty + y * view.s - d / 2) + 'px';

            if (state.isDrawing) {
                if (state.currentTool === 'brush' || state.currentTool === 'eraser') {
                    const color = state.currentTool === 'eraser' ? '#ffffff' : state.currentColor;
                    drawLine(state.lastX, state.lastY, x, y, color, state.brushSize, state.brushOpacity);
                    state.lastX = x;
                    state.lastY = y;
                } else if (state.currentTool === 'smudge') {
                    smudge(x, y, state.brushSize);
                    state.lastX = x;
                    state.lastY = y;
                }
            }
        });

        uvCanvas.addEventListener('mouseup', () => {
            if (state.isDrawing && (state.currentTool === 'brush' || 
                state.currentTool === 'eraser' || state.currentTool === 'smudge')) {
                saveState();
            }
            state.isDrawing = false;
        });

        uvCanvas.addEventListener('mouseleave', () => {
            state.isDrawing = false;
            brushPreview.style.display = 'none';
        });

        uvCanvas.addEventListener('mouseenter', () => {
            brushPreview.style.display = 'block';
        });

        // Tool selection
        document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tool-btn[data-tool]').forEach(b => 
                    b.classList.remove('active'));
                btn.classList.add('active');
                state.currentTool = btn.dataset.tool;
                document.getElementById('current-tool').textContent = 
                    btn.textContent.trim();
            });
        });

        // Brush size
        document.getElementById('brush-size').addEventListener('input', (e) => {
            state.brushSize = parseInt(e.target.value);
            document.getElementById('size-value').textContent = state.brushSize + 'px';
        });

        // Brush opacity
        document.getElementById('brush-opacity').addEventListener('input', (e) => {
            state.brushOpacity = parseInt(e.target.value) / 100;
            document.getElementById('opacity-value').textContent = e.target.value + '%';
        });

        // Color picker
        document.getElementById('color-picker').addEventListener('input', (e) => {
            state.currentColor = e.target.value;
            updateColorSwatches();
        });

        // Color swatches
        document.querySelectorAll('.color-swatch').forEach(swatch => {
            swatch.addEventListener('click', () => {
                state.currentColor = swatch.dataset.color;
                document.getElementById('color-picker').value = state.currentColor;
                updateColorSwatches();
            });
        });

        function updateColorSwatches() {
            document.querySelectorAll('.color-swatch').forEach(swatch => {
                swatch.classList.remove('active');
                if (swatch.dataset.color === state.currentColor) {
                    swatch.classList.add('active');
                }
            });
        }

        // Action buttons
        document.getElementById('undo-btn').addEventListener('click', undo);
        document.getElementById('redo-btn').addEventListener('click', redo);
        
        document.getElementById('clear-btn').addEventListener('click', () => {
            if (confirm('Clear the entire canvas?')) {
                drawUVTemplate();
            }
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'uv-texture.png';
            link.href = uvCanvas.toDataURL();
            link.click();
        });

        function loadCustomTemplate() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const img = new Image();
                img.onload = () => {
                    ctx.drawImage(img, 0, 0, uvCanvas.width, uvCanvas.height);
                    URL.revokeObjectURL(img.src);
                    saveState();
                };
                img.onerror = () => alert('Failed to load image: ' + file.name);
                img.src = URL.createObjectURL(file);
            };
            input.click();
        }

        document.getElementById('template-btn').addEventListener('click', loadCustomTemplate);

        const GUIDE_MODES = ['off', 'outlines', 'full'];
        function updateGuideButton() {
            const btn = document.getElementById('guide-btn');
            btn.classList.toggle('active', state.guideMode !== 'off');
            uvGuide.style.display = state.guideMode === 'off' ? 'none' : 'block';
            btn.textContent = state.guideMode === 'off' ? 'Guide' : state.guideMode === 'outlines' ? 'Outlines' : 'Full Wireframe';
        }
        document.getElementById('guide-btn').addEventListener('click', () => {
            state.guideMode = GUIDE_MODES[(GUIDE_MODES.indexOf(state.guideMode) + 1) % GUIDE_MODES.length];
            updateGuideButton();
            if (boxMesh && state.guideMode !== 'off') drawUVWireframe(boxMesh);
        });

        document.getElementById('fit-btn').addEventListener('click', fitView);

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') {
                    e.preventDefault();
                    undo();
                } else if (e.key === 'y') {
                    e.preventDefault();
                    redo();
                }
            } else {
                switch(e.key.toLowerCase()) {
                    case 'b':
                        document.querySelector('[data-tool="brush"]').click();
                        break;
                    case 'g':
                        document.querySelector('[data-tool="fill"]').click();
                        break;
                    case 'e':
                        document.querySelector('[data-tool="eraser"]').click();
                        break;
                    case 'i':
                        document.querySelector('[data-tool="eyedropper"]').click();
                        break;
                    case 's':
                        document.querySelector('[data-tool="smudge"]').click();
                        break;
                    case 'f':
                        fitView();
                        break;
                    case 'r':
                        if (boxMesh) boxMesh.rotation.y += Math.PI;
                        break;
                }
            }
        });

        // ============================================
        // INITIALIZATION
        // ============================================
        drawUVTemplate();
        initThreeJS();

        console.log('UV Texture Painting Studio initialized successfully!');
        console.log('Keyboard shortcuts: B=Brush, G=Fill, E=Eraser, I=Eyedropper, S=Smudge, R=Rotate model, F=Fit 2D view');
        console.log('Ctrl+Z=Undo, Ctrl+Y=Redo');
    </script>
</body>
</html>
